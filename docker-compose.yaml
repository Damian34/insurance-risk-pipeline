networks:
  api-network:

volumes:
  rabbitmq_data:
  generator_data:
  insurance_db:

services:
  data-generator:
    build: ./insurance-data-generator
    container_name: insurance-data-generator
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: admin
      RABBITMQ_PASSWORD: admin
    networks:
      - api-network
    volumes:
      - generator_data:/app/data

  spark-job:
    image: apache/spark:3.5.0
    depends_on:
      - spark-master
      - spark-worker
    volumes:
      - ./processing/spark-job/target/scala-2.12/app.jar:/app/app.jar
    command: >
      /opt/spark/bin/spark-submit
      --class com.damian.JobApplication
      --master spark://spark-master:7077
      /app/app.jar
    networks:
      - api-network

  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MODE: master
    ports:
      - "8090:8080"  # Spark UI
      - "7077:7077"  # Spark master port
    networks:
      - api-network

  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - api-network

  insurance-db:
    image: postgres:18.0-alpine
    container_name: insurance-db
    restart: always
    environment:
      POSTGRES_DB: insurance-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - api-network
    volumes:
      - insurance_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d insurance-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.2-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    networks:
      - api-network
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
